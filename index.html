<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jingze Zhang (张竞择), Ph.D. student at Peking University and research intern at BIGAI, working on humanoid loco-manipulation.">
    <meta name="theme-color" content="#fcfcfa">
    <title>Jingze Zhang | Publications &amp; Preprints</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script defer src="content.js"></script>
    <script defer src="site.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#home">Skip to content</a>
    <header class="site-header">
      <nav aria-label="Main navigation">
        <a href="#home" aria-current="location">Home</a>
        <a id="publications-nav" href="#publications">Publications</a>
        <a id="preprints-nav" href="#preprints" hidden>Preprints</a>
        <a id="updates-nav" href="#updates" hidden>Updates</a>
      </nav>
    </header>
    <main>
      <section id="home" class="profile" aria-labelledby="profile-name">
        <div class="portrait-area">
          <div id="portrait" class="portrait-placeholder" role="img" aria-label="Portrait placeholder">
            <span class="portrait-outline" aria-hidden="true"></span>
            <span class="portrait-label">Your photo</span>
          </div>
        </div>
        <div class="profile-copy">
          <h1 id="profile-name"><span id="name">Jingze Zhang</span> <span id="chinese-name" lang="zh">张竞择</span></h1>
          <p id="role" class="profile-role"></p>
          <div id="introduction" class="introduction"></div>
          <div id="profile-links" class="profile-links" aria-label="Profile links"></div>
        </div>
      </section>
      <section id="publications" class="research-section" aria-labelledby="publications-heading">
        <div class="section-heading">
          <h2 id="publications-heading">Publications</h2>
          <span id="publications-contribution-note" class="section-note" hidden>* Equal contribution</span>
        </div>
        <div id="publications-list" class="research-list"></div>
      </section>
      <section id="preprints" class="research-section" aria-labelledby="preprints-heading" hidden>
        <div class="section-heading">
          <h2 id="preprints-heading">Preprints</h2>
          <span id="preprints-contribution-note" class="section-note" hidden>* Equal contribution</span>
        </div>
        <div id="preprints-list" class="research-list"></div>
      </section>
      <section id="updates" class="updates-section" aria-labelledby="updates-heading" hidden>
        <div class="section-heading"><h2 id="updates-heading">Updates</h2></div>
        <ul id="updates-list" class="updates-list"></ul>
      </section>
    </main>
    <footer><span id="footer-name">Jingze Zhang</span><span>Personal academic homepage</span></footer>
    <noscript><p class="noscript-note">Please enable JavaScript to view the profile and papers.</p></noscript>
  </body>
</html>
